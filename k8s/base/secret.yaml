apiVersion: v1
kind: Secret
metadata:
  name: insurance-erp-secret
  namespace: insurance-erp
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production
  POSTGRES_DB: insurance_erp
  POSTGRES_USER: erp
  POSTGRES_PASSWORD: erppass
  DATABASE_URL: postgres://erp:erppass@postgres:5432/insurance_erp
  REDIS_URL: redis://redis:6379/0
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
