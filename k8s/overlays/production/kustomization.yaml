apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: insurance-erp
images:
  - name: insurance-erp-backend
    newName: your-registry.example.com/insurance-erp-backend
    newTag: "2026.07.18"
  - name: insurance-erp-frontend
    newName: your-registry.example.com/insurance-erp-frontend
    newTag: "2026.07.18"
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
