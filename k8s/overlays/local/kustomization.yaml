apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: insurance-erp
images:
  - name: insurance-erp-backend
    newName: insurance-erp-backend
    newTag: latest
  - name: insurance-erp-frontend
    newName: insurance-erp-frontend
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
