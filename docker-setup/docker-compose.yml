# ── Shared network ────────────────────────────────────────────────────────────
networks:
  erp-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  media-files:
  static-files:

# ── Re-usable backend env block ───────────────────────────────────────────────
x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-super-secret-dev-key-change-in-production}
  DEBUG: ${DEBUG:-False}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insurance_erp}
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://frontend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@insurance-erp.com}

# ── Re-usable backend build block ─────────────────────────────────────────────
x-backend-base: &backend-base
  build:  
    context: ../back_end
    dockerfile: Dockerfile
  image: insurance-erp-backend:latest
  volumes:
    - media-files:/app/media
    - static-files:/app/staticfiles
  networks:
    - erp-net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-insurance_erp}
      POSTGRES_USER:     ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erppass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - erp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-insurance_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - erp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Django (Daphne ASGI) ────────────────────────────────────────────────────
  backend:
    <<: *backend-base
    pull_policy: never
    environment:
      <<: *backend-env
      SERVICE_ROLE: web
    entrypoint: ["/app/entrypoint.sh"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/login/', timeout=3)\" 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery-worker:
    <<: *backend-base
    pull_policy: never
    environment:
      <<: *backend-env
      SERVICE_ROLE: worker
    entrypoint: ["/app/entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    <<: *backend-base
    pull_policy: never
    environment:
      <<: *backend-env
      SERVICE_ROLE: beat
    entrypoint: ["/app/entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy

  # ── React + Nginx ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""        # Empty = relative URLs (Nginx proxies /api/ → backend)
    image: insurance-erp-frontend:latest
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - erp-net
    depends_on:
      - backend
    restart: unless-stopped
